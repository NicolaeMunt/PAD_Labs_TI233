spring.application.name=gateway
server.port=8080

# ---- clients → gateway: keep connections open and serve each request on a virtual thread ----
spring.threads.virtual.enabled=true
server.tomcat.keep-alive-timeout=60s
server.tomcat.max-keep-alive-requests=1000
server.tomcat.max-connections=10000

# ---- gateway → API instances (DW nodes), grouped by warehouse ----
# Fixed instances (warehouse=URL, or a bare URL for the default warehouse). Empty: in docker compose
# the gateway creates every instance itself. Without Docker, list APIs you started yourself, e.g.
#   gateway.backends=warehouse-1=http://localhost:8081,warehouse-2=http://localhost:8082
gateway.backends=
# requests without an X-Warehouse header go here
gateway.default-warehouse=warehouse-1
# round-robin | least-connections (between the instances of one warehouse)
gateway.strategy=round-robin
gateway.health.interval=2s
gateway.health.timeout=2s
gateway.health.failures-before-down=2
gateway.pool.max-total=200
gateway.pool.max-per-backend=50
gateway.pool.connect-timeout=1s
gateway.pool.response-timeout=10s
gateway.pool.idle-timeout=15s

# ---- response cache in Redis ----
gateway.cache.enabled=true
gateway.cache.ttl=30s
gateway.cache.paths=/api/
spring.data.redis.host=localhost
spring.data.redis.port=6379
# a slow Redis must not hold requests for long: on a timeout the gateway skips the cache for 5 s
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=2s

# ---- horizontal scaling: per warehouse N API containers + its own replica set of max(3, N) Mongo nodes ----
# off outside docker compose; compose turns it on and mounts /var/run/docker.sock
gateway.provisioner.enabled=false
gateway.provisioner.docker-socket=/var/run/docker.sock
gateway.provisioner.api-image=gamevault-api:latest
gateway.provisioner.mongo-image=mongo:8
gateway.provisioner.network=gamevault-net
# API instance i is published on the first free host port in this range (direct calls)
gateway.provisioner.host-port-from=8081
gateway.provisioner.host-port-to=8099
gateway.provisioner.mongo-cache-gb=0.25
gateway.provisioner.redis-host=localhost
gateway.provisioner.min-db-copies=3
gateway.provisioner.max-replicas=5
gateway.provisioner.max-warehouses=5
gateway.provisioner.drain-timeout=15s
gateway.provisioner.mongo-timeout=90s
# created at startup (1 API instance + 3 database copies each) if they do not exist yet; compose sets these
gateway.initial-warehouses=

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# the gateway stays healthy without Redis (it only loses its cache)
management.health.redis.enabled=false
