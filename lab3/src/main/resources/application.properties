spring.application.name=demo
# Docker Compose points this at the replica set (mongo-1,mongo-2,mongo-3, replicaSet=rs0).
# The URI carries no database: every warehouse gets its own one, named below.
spring.mongodb.uri=mongodb://localhost:27017
# one database per warehouse, e.g. gamevault_warehouse-2 (overrides any database in the URI)
spring.mongodb.database=gamevault_${app.warehouse}
# create the indexes declared on the entities (off by default); needed for uq_title_dev_active
spring.data.mongodb.auto-index-creation=true
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
spring.mvc.problemdetails.enabled=true
# APP_INSTANCE_ID / APP_WAREHOUSE override these per container
app.instance-id=api-1
app.warehouse=warehouse-1
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
app.cache.games-ttl=10m
app.cache.default-ttl=5m
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
