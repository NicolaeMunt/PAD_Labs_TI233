# Clients → gateway (:8080) → the API instances of a warehouse → that warehouse's own MongoDB replica set.
#
# Warehouses: every warehouse has
#   - N API instances      api-<warehouse>-1 .. api-<warehouse>-N   (N = 1..5, chosen by the client)
#   - its own replica set  rs-<warehouse> with max(3, N) Mongo nodes mongo-<warehouse>-1 ..,
#                          one data volume each (gamevault-mongo-<warehouse>-<i>), database gamevault_<warehouse>
# API instance i reads from Mongo node i; all writes go to the replica set's primary (w=majority).
#
# Compose only starts the gateway, Redis and the web UI. The gateway creates all API containers and
# Mongo nodes itself, through the Docker socket: on startup warehouse-1/2/3 (1 API + 3 Mongo nodes each),
# later whatever the client asks for (PUT /gateway/warehouses/{name} {"replicas": n}).
# Each API instance is also published on a free host port in 8081..8099 for direct calls.
#
# Stop: compose does not manage the containers and volumes the gateway created, so remove them first:
#   docker rm -f $(docker ps -aq --filter label=gamevault.managed=true)
#   docker volume rm $(docker volume ls -q --filter label=gamevault.managed=true)   # deletes all warehouse data
#   docker compose down
# The data of the old shared replica set rs0 (volumes gamevault_mongo-1/2/3-data) is not migrated.
name: gamevault

services:
  # build-only: builds the API image the gateway starts its containers from, then exits
  api-image:
    build: .
    image: gamevault-api:latest
    entrypoint: ["true"]
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_DEFAULTWAREHOUSE: warehouse-1
      GATEWAY_INITIALWAREHOUSES: warehouse-1,warehouse-2,warehouse-3
      GATEWAY_STRATEGY: round-robin          # or least-connections
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # horizontal scaling: the gateway starts/stops API containers and Mongo nodes through the Docker socket
      GATEWAY_PROVISIONER_ENABLED: "true"
      GATEWAY_PROVISIONER_APIIMAGE: gamevault-api:latest
      GATEWAY_PROVISIONER_MONGOIMAGE: mongo:8
      GATEWAY_PROVISIONER_NETWORK: gamevault-net
      GATEWAY_PROVISIONER_REDISHOST: redis
      GATEWAY_PROVISIONER_REDISPORT: 6379
      GATEWAY_PROVISIONER_HOSTPORTFROM: 8081
      GATEWAY_PROVISIONER_HOSTPORTTO: 8099
      GATEWAY_PROVISIONER_MONGOCACHEGB: "0.25"
      GATEWAY_PROVISIONER_MINDBCOPIES: 3
      GATEWAY_PROVISIONER_MAXREPLICAS: 5
      GATEWAY_PROVISIONER_MAXWAREHOUSES: 5
    volumes:
      # lets the gateway start and stop containers (it gets full control of Docker: fine for a lab)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api-image:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_URL: http://gateway:8080
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - gateway

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# a fixed name, so the gateway can attach the containers it starts to it
networks:
  default:
    name: gamevault-net
