# Clients → gateway (:8080) → api-1 / api-2 / api-3 → one MongoDB + one Redis.
# The API instances have no published ports: the gateway is the only way in.

x-api: &api
  build: .
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

x-api-env: &api-env
  SPRING_MONGODB_URI: mongodb://mongo:27017/gamevault
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_BACKENDS: http://api-1:8080,http://api-2:8080,http://api-3:8080
      GATEWAY_STRATEGY: round-robin          # or least-connections
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      api-1:
        condition: service_started
      api-2:
        condition: service_started
      api-3:
        condition: service_started

  api-1:
    <<: *api
    environment:
      <<: *api-env
      APP_INSTANCE_ID: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-env
      APP_INSTANCE_ID: api-2

  api-3:
    <<: *api
    environment:
      <<: *api-env
      APP_INSTANCE_ID: api-3

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_URL: http://gateway:8080
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - gateway

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
